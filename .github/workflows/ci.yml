name: build-and-test
on:
    push:
    pull_request:
    workflow_dispatch:
        inputs:
            stress_seed:
                description: Decimal stress seed (1 to 4294967295)
                type: string
                default: "1592594996"
            stress_rounds:
                description: Stress rounds (5 to 100 recommended; 180-second test timeout)
                type: string
                default: "10"
permissions:
    contents: read
env:
    OMP_PG_STRESS_SEED: ${{ inputs.stress_seed || '1592594996' }}
    OMP_PG_STRESS_ROUNDS: ${{ inputs.stress_rounds || '10' }}
concurrency:
    group: build-and-test-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true
jobs:
    linux:
        runs-on: ubuntu-24.04
        env:
            ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
            UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        strategy:
            fail-fast: false
            matrix:
                sanitize: ["OFF", "ON"]
        steps:
            - uses: actions/checkout@v4
            - name: PostgreSQL 17 development tools
              run: |
                  sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
                  sudo apt-get update
                  sudo apt-get install -y libpq-dev postgresql-17 ninja-build
                  echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
            - run: |
                  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPG_SANITIZE=${{ matrix.sanitize }} -DPG_BUILD_BENCHMARK=ON
            - run: |
                  cmake --build build --parallel 4
            - run: |
                  python3 tests/run_postgres.py --build build
            - name: Verify package, fault fixture, and CTest qualification regressions
              run: python3 -m unittest discover -s tests -p 'test_*.py' -v
            - name: Compile all Pawn examples with warnings treated as errors
              run: |
                  cmake -S build/_deps/pawn-src/source/compiler -B build-pawn -G Ninja \
                  	-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_FLAGS='-DPAWN_CELL_SIZE=32 -std=gnu17'
                  cmake --build build-pawn --parallel 4
                  git clone https://github.com/openmultiplayer/omp-stdlib.git build-stdlib
                  git -C build-stdlib checkout 46a5d1d7ac8985e4104f745c462a247a0c2eb6a0
                  for script in smoke unload callbacks extensions bootstrap sections; do
                      ./build-pawn/pawncc "examples/$script.pwn" -E -ipawn -ibuild-stdlib \
                          -ibuild/_deps/pawn-src/include "-obuild/$script.amx"
                  done
            - name: Retain core test and sanitizer logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: linux-x64-test-logs-${{ matrix.sanitize }}
                  path: |
                      build/Testing/Temporary/*.log
                      build/Testing/Temporary/qualification.xml
                      /tmp/omp-pg-integration-*/command-*.log
                      /tmp/omp-pg-integration-*/server.log
    linux-x86:
        name: Linux x86 and open.mp
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - name: Install multilib, 32-bit TLS and the PostgreSQL server tools
              run: |
                  sudo dpkg --add-architecture i386
                  sudo apt-get update
                  sudo apt-get install -y g++-multilib libc6-dev-i386 libssl-dev:i386 bison flex perl ninja-build
                  sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
                  sudo apt-get update
                  sudo apt-get install -y postgresql-17
                  echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
            - name: Build PostgreSQL 17.11 libpq with 32-bit TLS
              run: |
                  curl --fail --location --retry 3 \
                  	https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz -o \
                  	postgresql-17.11.tar.gz
                  echo '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e  postgresql-17.11.tar.gz' | sha256sum --check --strict
                  tar -xzf postgresql-17.11.tar.gz
                  bash scripts/build-libpq-linux32.sh postgresql-17.11 "$PWD/libpq32"
                  echo "LD_LIBRARY_PATH=$PWD/libpq32/lib" >> "$GITHUB_ENV"
            - name: Build the x86 component
              run: |
                  cmake -S . -B build-linux32 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-m32 \
                      -DCMAKE_C_FLAGS=-m32 -DPG_BUILD_BENCHMARK=ON "-DPostgreSQL_INCLUDE_DIR=$PWD/libpq32/include" \
                  	"-DPostgreSQL_LIBRARY=$PWD/libpq32/lib/libpq.so"
                  cmake --build build-linux32 --parallel 4
            - name: Build Pawn32 and compile the server regression scripts
              run: |
                  cmake -S build-linux32/_deps/pawn-src/source/compiler -B build-pawn32 -G Ninja \
                  	-DCMAKE_POLICY_VERSION_MINIMUM=3.5 '-DCMAKE_C_FLAGS=-m32 -DPAWN_CELL_SIZE=32 -std=gnu17' \
                  	-DBUILD_TESTING=OFF
                  cmake --build build-pawn32 --parallel 4
                  git clone https://github.com/openmultiplayer/omp-stdlib.git build-stdlib
                  git -C build-stdlib checkout 46a5d1d7ac8985e4104f745c462a247a0c2eb6a0
                  for script in smoke unload callbacks extensions bootstrap sections; do
                      ./build-pawn32/pawncc "examples/$script.pwn" -E -ipawn -ibuild-stdlib \
                  		-ibuild-linux32/_deps/pawn-src/include "-obuild-linux32/$script.amx"
                  done
            - name: Obtain the fixed open.mp distribution with dynamic OpenSSL
              run: |
                  curl --fail --location --retry 3 \
                  	https://github.com/openmultiplayer/open.mp/releases/download/v1.5.8.3079/open.mp-linux-x86-dynssl.tar.gz \
                  	-o openmp-linux-dynssl.tar.gz
                  echo '2be12550e3aaff0e60510ae8823e18b9759990eca3f02c101a49bcb3c985d222  openmp-linux-dynssl.tar.gz' | sha256sum --check --strict
                  mkdir -p "$RUNNER_TEMP/openmp"
                  tar -xzf openmp-linux-dynssl.tar.gz -C "$RUNNER_TEMP/openmp"
                  echo "OPENMP_DIR=$RUNNER_TEMP/openmp/Server" >> "$GITHUB_ENV"
            - name: Test the x86 core, real server, VM unload and callback regressions
              run: |
                  python3 tests/run_postgres.py --build build-linux32 --config Release --openmp-dir "$OPENMP_DIR" \
                  	--component build-linux32/omp-postgresql.so --gamemode build-linux32/smoke.amx --unload-script \
                  	build-linux32/unload.amx --callback-gamemode build-linux32/callbacks.amx \
                      --extension-gamemode build-linux32/extensions.amx --bootstrap-gamemode build-linux32/bootstrap.amx \
                      --section-gamemode build-linux32/sections.amx --section-sql examples/sql/accounts.sql --runtime \
                  	"$PWD/libpq32/lib/libpq.so.5"
            - name: Assemble and verify the Linux x86 package
              run: |
                  python3 scripts/package.py create --platform linux --build build-linux32 \
                      --libpq libpq32/lib/libpq.so.5 --postgres-license postgresql-17.11/COPYRIGHT
                  python3 scripts/package.py create --platform linux --build build-linux32 \
                      --libpq libpq32/lib/libpq.so.5 --postgres-license postgresql-17.11/COPYRIGHT \
                      --output build-dist-repeat
                  cmp build-dist/*.zip build-dist-repeat/*.zip
                  python3 scripts/package.py verify --archive "$(echo build-dist/*.zip)" \
                      --destination build-package-check
            - name: Compile examples from the extracted package
              run: |
                  for script in smoke unload callbacks extensions bootstrap sections; do
                      ./build-pawn32/pawncc "build-package-check/omp-postgresql/examples/$script.pwn" -E \
                          -ibuild-package-check/omp-postgresql/qawno/include -ibuild-stdlib \
                          -ibuild-linux32/_deps/pawn-src/include "-obuild-linux32/packaged-$script.amx"
                  done
            - name: Test the package in a fresh Linux server
              run: |
                  mkdir -p "$RUNNER_TEMP/openmp-package"
                  tar -xzf openmp-linux-dynssl.tar.gz -C "$RUNNER_TEMP/openmp-package"
                  export LD_LIBRARY_PATH="$PWD/build-package-check/omp-postgresql/lib"
                  python3 tests/run_postgres.py --build build-linux32 --only-openmp \
                      --openmp-dir "$RUNNER_TEMP/openmp-package/Server" \
                      --component build-package-check/omp-postgresql/components/omp-postgresql.so \
                      --gamemode build-linux32/packaged-smoke.amx --unload-script build-linux32/packaged-unload.amx \
                      --callback-gamemode build-linux32/packaged-callbacks.amx \
                      --extension-gamemode build-linux32/packaged-extensions.amx \
                      --bootstrap-gamemode build-linux32/packaged-bootstrap.amx \
                      --section-gamemode build-linux32/packaged-sections.amx \
                      --section-sql build-package-check/omp-postgresql/examples/sql/accounts.sql
            - name: Upload the validated Linux x86 package and SHA-256
              uses: actions/upload-artifact@v4
              with:
                  name: omp-postgresql-linux-x86-${{ github.sha }}
                  path: build-dist/*
                  if-no-files-found: error
            - name: Retain the x86 test logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: linux-x86-test-logs
                  path: |
                      build-linux32/Testing/Temporary/*.log
                      build-linux32/Testing/Temporary/qualification.xml
                      ${{ runner.temp }}/openmp/Server/pg-*-output.log
                      ${{ runner.temp }}/openmp-package/Server/pg-*-output.log
                      /tmp/omp-pg-integration-*/command-*.log
                      /tmp/omp-pg-integration-*/server.log
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
                      mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-postgresql
                      mingw-w64-ucrt-x86_64-python git
            - shell: msys2 {0}
              run: |
                  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPG_BUILD_BENCHMARK=ON
                  cmake --build build --parallel 4
            - name: Obtain isolated PostgreSQL server tools
              shell: pwsh
              run: |
                  Invoke-WebRequest `
                  	https://get.enterprisedb.com/postgresql/postgresql-17.11-3-windows-x64-binaries.zip -OutFile `
                  	postgres.zip
                  if ((Get-FileHash postgres.zip -Algorithm SHA256).Hash -ne '4B8DB0930C38F6EF845DB919551DEDDA3B6B845AEB0927B3D79A6E8E9E4537CF') {
                  	throw 'PostgreSQL archive checksum changed'
                  }
                  Expand-Archive postgres.zip -DestinationPath build-server
            - shell: msys2 {0}
              run: |
                  python tests/run_postgres.py --build build --postgres-bin build-server/pgsql/bin
            - name: Verify CTest qualification regressions
              shell: msys2 {0}
              run: python -m unittest discover -s tests -p test_ctest_qualification.py -v
            - name: Retain core test logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-x64-test-logs
                  path: |
                      build/Testing/Temporary/*.log
                      build/Testing/Temporary/qualification.xml
    windows-x86:
        name: Windows x86 MSVC and open.mp
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - name: Preserve LF in the source build scripts
              shell: pwsh
              run: |
                  git config --global core.autocrlf false
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
                  architecture: x64
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW32
                  update: true
                  install: >-
                      mingw-w64-i686-gcc mingw-w64-i686-openssl
                      make bison flex perl diffutils git tar curl
            - name: Build PostgreSQL 17.11 libpq with 32-bit TLS
              shell: msys2 {0}
              run: |
                  curl --fail --location --retry 3 \
                  	https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.bz2 -o \
                  	postgresql-17.11.tar.bz2
                  echo 'dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979  postgresql-17.11.tar.bz2' | sha256sum --check --strict
                  tar -xjf postgresql-17.11.tar.bz2
                  bash scripts/build-libpq-mingw32.sh postgresql-17.11 "$(pwd)/libpq32"
                  cp /mingw32/bin/libssl-3.dll /mingw32/bin/libcrypto-3.dll libpq32/bin/
                  cygpath -w /mingw32/bin >> "$GITHUB_PATH"
                  cygpath -w "$PWD/libpq32/bin" >> "$GITHUB_PATH"
                  echo "MINGW32_ROOT=$(cygpath -m /mingw32)" >> "$GITHUB_ENV"
            - name: Generate the MSVC import library and build the x86 component
              shell: pwsh
              run: |
                  $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
                  $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $vsRoot) {
                  	throw 'MSVC C++ tools were not found'
                  }
                  $vcVersion = (Get-Content -LiteralPath (Join-Path $vsRoot 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
                  $libTool = Join-Path $vsRoot "VC/Tools/MSVC/$vcVersion/bin/Hostx64/x86/lib.exe"
                  if (-not (Test-Path -LiteralPath $libTool -PathType Leaf)) {
                  	throw 'MSVC x86 lib.exe was not found'
                  }
                  ./scripts/create-msvc-import.ps1 -PostgreSQLRoot libpq32 -LibTool $libTool
                  cmake -S . -B build-msvc32 -A Win32 -DPG_BUILD_BENCHMARK=ON `
                  	"-DPostgreSQL_INCLUDE_DIR=$env:GITHUB_WORKSPACE/libpq32/include" `
                  	"-DPostgreSQL_LIBRARY=$env:GITHUB_WORKSPACE/libpq32/lib/libpq.lib"
                  if ($LASTEXITCODE -ne 0) {
                  	throw 'MSVC x86 CMake configuration failed'
                  }
                  cmake --build build-msvc32 --config Release --parallel 4
                  if ($LASTEXITCODE -ne 0) {
                  	throw 'MSVC x86 component build failed'
                  }
            - name: Build Pawn32 and compile the server regression scripts
              shell: pwsh
              run: |
                  cmake -S build-msvc32/_deps/pawn-src/source/compiler -B build-pawn32 -A Win32 `
                  	'-DCMAKE_POLICY_VERSION_MINIMUM=3.5' '-DCMAKE_C_FLAGS=/DPAWN_CELL_SIZE=32 /DHAVE_ALLOCA_H=0' `
                  	-DBUILD_TESTING=OFF
                  if ($LASTEXITCODE -ne 0) {
                  	throw 'Pawn32 CMake configuration failed'
                  }
                  cmake --build build-pawn32 --config Release --parallel 4
                  if ($LASTEXITCODE -ne 0) {
                  	throw 'Pawn32 compiler build failed'
                  }
                  git clone https://github.com/openmultiplayer/omp-stdlib.git build-stdlib
                  if ($LASTEXITCODE -ne 0) {
                  	throw 'open.mp standard library checkout failed'
                  }
                  git -C build-stdlib checkout 46a5d1d7ac8985e4104f745c462a247a0c2eb6a0
                  if ($LASTEXITCODE -ne 0) {
                  	throw 'open.mp standard library revision was not found'
                  }
                  foreach ($script in 'smoke', 'unload', 'callbacks', 'extensions', 'bootstrap', 'sections') {
                    & ./build-pawn32/Release/pawncc.exe "examples/$script.pwn" '-E' '-ipawn' '-ibuild-stdlib' `
                    	'-ibuild-msvc32/_deps/pawn-src/include' "-obuild-msvc32/$script.amx"
                    if ($LASTEXITCODE -ne 0) {
                    	throw "Pawn32 compilation failed: $script"
                    }
                  }
            - name: Obtain the fixed PostgreSQL server and open.mp distributions
              shell: pwsh
              run: |
                  Invoke-WebRequest `
                  	https://get.enterprisedb.com/postgresql/postgresql-17.11-3-windows-x64-binaries.zip -OutFile `
                  	postgres.zip
                  if ((Get-FileHash postgres.zip -Algorithm SHA256).Hash -ne '4B8DB0930C38F6EF845DB919551DEDDA3B6B845AEB0927B3D79A6E8E9E4537CF') {
                  	throw 'PostgreSQL archive checksum changed'
                  }
                  Expand-Archive postgres.zip -DestinationPath build-server
                  Invoke-WebRequest `
                  	https://github.com/openmultiplayer/open.mp/releases/download/v1.5.8.3079/open.mp-win-x86.zip `
                  	-OutFile openmp.zip
                  if ((Get-FileHash openmp.zip -Algorithm SHA256).Hash -ne 'D1B5EA1D09E7DE0F144BF0055183E3CEAAD5FF8A0A8E791021141E8973F84E03') {
                  	throw 'open.mp archive checksum changed'
                  }
                  Expand-Archive openmp.zip -DestinationPath build-openmp
            - name: Test the x86 core, real server, VM unload and callback regressions
              shell: pwsh
              run: |
                  python tests/run_postgres.py --build build-msvc32 --config Release --postgres-bin `
                  	build-server/pgsql/bin --openmp-dir build-openmp/Server --component `
                  	build-msvc32/Release/omp-postgresql.dll --gamemode build-msvc32/smoke.amx --unload-script `
                  	build-msvc32/unload.amx --callback-gamemode build-msvc32/callbacks.amx `
                      --extension-gamemode build-msvc32/extensions.amx --bootstrap-gamemode build-msvc32/bootstrap.amx `
                      --section-gamemode build-msvc32/sections.amx --section-sql examples/sql/accounts.sql --runtime `
                  	libpq32/bin/libpq.dll --runtime libpq32/bin/libssl-3.dll --runtime libpq32/bin/libcrypto-3.dll
                  if ($LASTEXITCODE -ne 0) {
                  	throw 'MSVC x86 PostgreSQL/open.mp integration failed'
                  }
            - name: Assemble and verify the Windows x86 package
              shell: pwsh
              run: |
                  $packageArgs = @('scripts/package.py', 'create', '--platform', 'windows', '--build', 'build-msvc32',
                      '--libpq', 'libpq32/bin/libpq.dll', '--runtime-dir', "$env:MINGW32_ROOT/bin",
                      '--postgres-license', 'postgresql-17.11/COPYRIGHT',
                      '--openssl-license', "$env:MINGW32_ROOT/share/licenses/openssl/LICENSE",
                      '--pthread-license', "$env:MINGW32_ROOT/share/licenses/libwinpthread/COPYING",
                      '--objdump', "$env:MINGW32_ROOT/bin/objdump.exe")
                  python @packageArgs
                  if ($LASTEXITCODE -ne 0) { throw 'Package assembly failed' }
                  python @packageArgs --output build-dist-repeat
                  if ($LASTEXITCODE -ne 0) { throw 'Repeated package assembly failed' }
                  $archive = (Get-ChildItem -LiteralPath build-dist -Filter '*.zip').FullName
                  $repeat = (Get-ChildItem -LiteralPath build-dist-repeat -Filter '*.zip').FullName
                  if ((Get-FileHash -LiteralPath $archive).Hash -ne (Get-FileHash -LiteralPath $repeat).Hash) {
                      throw 'Archive assembly is not deterministic'
                  }
                  python scripts/package.py verify --archive $archive --destination build-package-check
                  if ($LASTEXITCODE -ne 0) { throw 'Archive verification failed' }
            - name: Compile examples from the extracted package
              shell: pwsh
              run: |
                  foreach ($script in @('smoke', 'unload', 'callbacks', 'extensions', 'bootstrap', 'sections')) {
                      ./build-pawn32/Release/pawncc.exe "build-package-check/omp-postgresql/examples/$script.pwn" -E `
                          -ibuild-package-check/omp-postgresql/qawno/include -ibuild-stdlib `
                          -ibuild-msvc32/_deps/pawn-src/include "-obuild-msvc32/packaged-$script.amx"
                      if ($LASTEXITCODE -ne 0) { throw "Packaged Pawn compilation failed: $script" }
                  }
            - name: Test the package in a fresh Windows server
              shell: pwsh
              run: |
                  Expand-Archive openmp.zip -DestinationPath build-openmp-package
                  # Remove development/runtime directories from DLL search; server tools are explicit.
                  $cmakeBin = Split-Path -Parent (Get-Command cmake).Source
                  $env:PATH = "$cmakeBin;$env:SystemRoot/System32;$env:SystemRoot"
                  $runtimeArgs = @()
                  Get-ChildItem -LiteralPath build-package-check/omp-postgresql -Filter '*.dll' | ForEach-Object {
                      $runtimeArgs += @('--runtime', $_.FullName)
                  }
                  & "$env:pythonLocation/python.exe" tests/run_postgres.py --build build-msvc32 --only-openmp `
                      --postgres-bin build-server/pgsql/bin --openssl "$env:MINGW32_ROOT/bin/openssl.exe" `
                      --openmp-dir build-openmp-package/Server `
                      --component build-package-check/omp-postgresql/components/omp-postgresql.dll `
                      --gamemode build-msvc32/packaged-smoke.amx --unload-script build-msvc32/packaged-unload.amx `
                      --callback-gamemode build-msvc32/packaged-callbacks.amx `
                      --extension-gamemode build-msvc32/packaged-extensions.amx `
                      --bootstrap-gamemode build-msvc32/packaged-bootstrap.amx `
                      --section-gamemode build-msvc32/packaged-sections.amx `
                      --section-sql build-package-check/omp-postgresql/examples/sql/accounts.sql @runtimeArgs
                  if ($LASTEXITCODE -ne 0) { throw 'Packaged open.mp integration failed' }
            - name: Upload the validated Windows x86 package and SHA-256
              uses: actions/upload-artifact@v4
              with:
                  name: omp-postgresql-windows-x86-${{ github.sha }}
                  path: build-dist/*
                  if-no-files-found: error
            - name: Retain the x86 test logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-x86-test-logs
                  path: |
                      build-msvc32/Testing/Temporary/*.log
                      build-msvc32/Testing/Temporary/qualification.xml
                      build-openmp/Server/pg-*-output.log
                      build-openmp-package/Server/pg-*-output.log
    verify-distribution-artifacts:
        name: Verify downloaded x86 distributions
        needs: [linux-x86, windows-x86]
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  pattern: omp-postgresql-*-x86-*
                  path: build-dist-download
                  merge-multiple: true
            - name: Verify and extract both uploaded packages
              run: |
                  shopt -s nullglob
                  for platform in linux windows; do
                      archives=(build-dist-download/*-"$platform"-x86.zip)
                      test "${#archives[@]}" -eq 1
                      python3 scripts/package.py verify --archive "${archives[0]}" \
                          --destination "build-verified-download/$platform"
                  done
