# Set PGSERVICEFILE to this file's absolute path in the server process environment.
# Password belongs in PGPASSFILE/.pgpass (Unix mode 0600), not here or in Pawn.
[game]
host=db.example.org
port=5432
dbname=game
user=game_runtime
sslmode=verify-full
sslrootcert=/etc/omp-postgresql/root.crt
connect_timeout=10
application_name=omp-postgresql
options=-c statement_timeout=30000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000

# Client certificate authentication, if pg_hba.conf requires it:
# sslcert=/etc/omp-postgresql/client.crt
# sslkey=/etc/omp-postgresql/client.key
